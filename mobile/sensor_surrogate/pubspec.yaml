name: sensor_surrogate
description: Flutter Android app simulating battery temperature via BLE for SCADA dorm climate control system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # BLE Peripheral for advertising
  flutter_ble_peripheral: ^2.0.0
  
  # Battery level reading
  battery_plus: ^5.0.2
  
  # Permissions handling
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true